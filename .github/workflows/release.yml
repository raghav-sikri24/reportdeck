name: Release

# Publishes to npm when a version tag (v1.2.3) is pushed.
# Uses npm trusted publishing (OIDC): no NPM_TOKEN secret, and npm adds
# provenance automatically because the repository and package are public.
# The npm-side trust configuration must name this exact file: release.yml

on:
  push:
    tags: ['v*']

permissions:
  contents: write # create the GitHub release
  id-token: write # npm trusted publishing (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm >= 11.5.1; pinned to 11 so a new major can't break releases.
      - run: npm install -g npm@11
      - run: pnpm install --frozen-lockfile
      - run: pnpm run verify
      - name: Check tag matches package version
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          if [ "$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $VERSION" >&2
            exit 1
          fi
      - run: npm publish --access public --ignore-scripts
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
